name: linux-verify

# POSIX 运行级验证（tiej 运行时模块）。本机无 Linux；CI 通道 = 复用最新编译器的
# Linux 目标 IR：用本地最新 stage0 tiec（Windows 侧唯一产物）生成 driver-linux.ll，
# 作为 release 资产 ci-linux-ir 发布；本工作流在 ubuntu 上取回、过门禁、clang 链接出
# tiec-linux，编译并运行 exec / fsglob / term 三个探针。产物全部落 _local_only/bin。
#
# 已知账目：内嵌解释器的 dynload 内建（LoadLibraryW/GetProcAddress）尚无 linux 分支，
# 链接用 .github/ci/linux-shims.c 垫片满足（探针不触该路径）；编译器侧待修。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tiej (probes)
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libc6-dev
          clang --version | head -1

      - name: Fetch trm_lite_linux.a and the sibling tiec repo
        run: |
          git clone --depth 1 https://github.com/tie-lang/trm-lite.git ../trm-lite
          ls -la ../trm-lite/trm_lite_linux.a
          git clone --depth 1 https://github.com/tie-lang/tiec.git ../tiec

      - name: Fetch Linux-target compiler IR (latest stage0 artifact)
        run: |
          curl -fsSL -o driver-linux.ll \
            https://github.com/tie-lang/tiej/releases/download/ci-linux-ir/driver-linux.ll
          ls -la driver-linux.ll

      - name: Gate - Windows-behaviour calls must be zero
        run: |
          set -e
          hits=$(grep -nE '^\s*(%[A-Za-z0-9_.]+ = )?call.*@(CreateProcessW|ReadFile|WriteFile|CreateFileW|closesocket|WSAStartup|CreateThread)\(' driver-linux.ll | head -20 || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "windows-behaviour calls present"; exit 1; fi
          echo "windows-behaviour calls: 0"
          echo "known dynload pair (shimmed):"
          grep -cE '^\s*(%[A-Za-z0-9_.]+ = )?call.*@(LoadLibraryW|GetProcAddress)\(' driver-linux.ll || true

      - name: Link stage0 Linux tiec
        run: |
          mkdir -p _local_only/bin
          clang -O1 -fuse-ld=lld driver-linux.ll .github/ci/linux-shims.c \
            ../trm-lite/trm_lite_linux.a -lm -o _local_only/bin/tiec-linux
          file _local_only/bin/tiec-linux

      - name: Compile and run probes (POSIX runtime verification)
        env:
          TIE_TRM_LITE_LIB: ${{ github.workspace }}/../trm-lite/trm_lite_linux.a
        run: |
          set -e
          T=$PWD/_local_only/bin/tiec-linux
          $T tests/exec_probe.tie  -o _local_only/bin/exec_probe
          $T tests/fsglob_probe.tie -o _local_only/bin/fsglob_probe
          $T tests/term_probe.tie  -o _local_only/bin/term_probe
          echo "== exec_probe =="
          _local_only/bin/exec_probe || true
          echo "== fsglob_probe =="
          _local_only/bin/fsglob_probe || true
          echo "== term_probe =="
          _local_only/bin/term_probe || true
          echo "== summary =="
          grep -aE "SUMMARY" /dev/null || true
